<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Patrick Hand', cursive;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: min(92vw, 420px);
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
    cursor: pointer;
  }

  .card img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .text {
    font-size: 3.2rem;
    text-align: center;
    line-height: 1.2;
    padding: 20px;
  }

  .controls {
    display: flex;
    gap: 14px;
    margin: 14px 0 6px;
  }

  button {
    font-size: 1.8rem;
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  .shuffle {
    margin-bottom: 14px;
    font-size: 1.3rem;
  }
</style>
</head>

<body>

<div class="card" id="card"></div>

<div class="controls">
  <button id="prev">«</button>
  <button id="play">▶</button>
  <button id="next">»</button>
</div>

<button class="shuffle" id="shuffle">🔀 Shuffle</button>

<script>
const cards = [
  {
    image: "https://i.postimg.cc/W419zbzC/dress.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846036/dress_nmle1w.wav",
    text: ["dress"]
  },
  {
    image: "https://i.postimg.cc/FKHPzsz6/jeans.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846034/jeans_tfl5ej.wav",
    text: ["jeans"]
  },
  {
    image: "https://i.postimg.cc/qvLbpCJZ/jumper-sweater.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846035/jumper_sweater_vsup8q.wav",
    text: ["jumper", "sweater"]
  },
  {
    image: "https://i.postimg.cc/0yfW9Jkh/shirt.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846035/t-shirt_lbg0vm.wav",
    text: ["shirt"]
  },
  {
    image: "https://i.postimg.cc/L8TCmZ9r/shorts.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846034/shorts_r1g13j.wav",
    text: ["shorts"]
  },
  {
    image: "https://i.postimg.cc/GmQ7bs3n/skirt.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846035/skirt_hlczfa.wav",
    text: ["skirt"]
  },
  {
    image: "https://i.postimg.cc/t45S9VqK/t-shirt.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846035/t-shirt_lbg0vm.wav",
    text: ["t-shirt"]
  },
  {
    image: "https://i.postimg.cc/R0ZPhVhD/trousers-pants.webp",
    audio: "https://res.cloudinary.com/dugvo3tsb/video/upload/v1769846035/trousers_pants_g37guw.wav",
    text: ["trousers", "pants"]
  }
];

let index = 0;
let flipped = false;
const audio = new Audio();

const card = document.getElementById("card");
const playBtn = document.getElementById("play");

function showImage() {
  flipped = false;
  audio.pause();
  card.innerHTML = `<img src="${cards[index].image}">`;
}

function showText() {
  flipped = true;
  const lines = cards[index].text.join("<br>");
  card.innerHTML = `<div class="text">${lines}</div>`;
}

function playAudio() {
  audio.src = cards[index].audio;
  audio.currentTime = 0;
  audio.play();
}

card.onclick = () => {
  if (!flipped) {
    showText();
    playAudio();
  } else {
    showImage();
  }
};

playBtn.onclick = () => {
  if (!flipped) {
    showText();
  }
  playAudio();
};

document.getElementById("prev").onclick = () => {
  index = (index - 1 + cards.length) % cards.length;
  showImage();
};

document.getElementById("next").onclick = () => {
  index = (index + 1) % cards.length;
  showImage();
};

document.getElementById("shuffle").onclick = () => {
  cards.sort(() => Math.random() - 0.5);
  index = 0;
  showImage();
};

showImage();
</script>

</body>
</html>
